name: run Sales_DB.py
#Run at 8 am
on:
    workflow_dispatch:
    schedule:
        - cron: '0 4 * * 1' # At 04:00, Monday (server time)

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      csv_files: ${{ steps.list_csvs.outputs.files }}
    steps:

      - name: Checkout repo content
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Python script
        env:
          ARIB_KEY: ${{ secrets.ARIB_KEY }}
          ARL_KEY: ${{ secrets.ARL_KEY }}
          ARNL_KEY: ${{ secrets.ARNL_KEY }}
          ARF_KEY: ${{ secrets.ARF_KEY }}
        run: python Sales_Orders/Sales_DB.py

      - name: List generated CSV files
        id: list_csvs
        run: |
          files=$(ls tmp_files/*.csv | jq -R -s -c 'split("\n")[:-1]')
          echo "files=$files" >> $GITHUB_OUTPUT
        shell: bash

      - name: Upload CSVs as artifacts
        uses: actions/upload-artifact@v4
        with:
            name: sales-csv-files
            path: tmp_files/*.csv



  upload:
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        file: ${{ fromJson(needs.build.outputs.csv_files) }}
    steps:
      - name: Checkout repo content
        uses: actions/checkout@v4

      - name: Download CSV artifacts
        uses: actions/download-artifact@v4
        with:
            name: sales-csv-files
            path: tmp_files

      - name: Upload ${{ matrix.file }} to Dropbox
        uses: ./upload-dropbox-action
        with:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_ALL_ACCESS_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_ALL_ACCESS_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_ALL_ACCESS_REFRESH_TOKEN }}
          SOURCE_PATH: ${{ matrix.file }}
          DEST_PATH: /Power BI Data Warehouse/CIn7 Data/API/Sales_DB_Monday/${{ matrix.file }}
