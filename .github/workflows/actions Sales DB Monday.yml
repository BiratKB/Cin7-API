name: run Sales_DB.py

on:
    workflow_dispatch:
    schedule:
        - cron: '0 6 * * 1'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      - name: checkout repo content
        uses: actions/checkout@v4 # checkout the repository content to github runner

      - name: setup python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13' # install the python version needed
          
      - name: install python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: execute py script
        env:
          ARIB_KEY: ${{ secrets.ARIB_KEY }}
          ARL_KEY: ${{ secrets.ARL_KEY }}
          ARNL_KEY: ${{ secrets.ARNL_KEY }}
          ARF_KEY: ${{ secrets.ARF_KEY }}
        run: python Sales_Orders/Sales_DB.py

      - name: Upload all Files to Dropbox
        run: |
            echo "Starting Dropbox uploads..."
            for file in tmp_files/*.csv; do
                if [ -f "$file" ]; then
                    echo "Uploading $file..."
                    gh workflow run ./upload-dropbox-action \
                        --app-key "${{ secrets.DROPBOX_ALL_ACCESS_APP_KEY }}" \
                        --app-secret "${{ secrets.DROPBOX_ALL_ACCESS_APP_SECRET }}" \
                        --refresh-token "${{ secrets.DROPBOX_ALL_ACCESS_REFRESH_TOKEN }}" \
                        --source "$file" \
                        --dest "/Power BI Data Warehouse/CIn7 Data/API/Sales_DB_Monday/$(basename "$file")"
                else
                    echo "No CSV files find in tmp_files/"
                    exit 1
                fi
            done
        shell: bash